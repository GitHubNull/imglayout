[package]
name = "imglayout-backend"
version = "0.1.0"
description = "imgLayout 照片拼接打印工具 —— Tauri 后端"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "imglayout_backend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
